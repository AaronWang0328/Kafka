[package]
name = "bridge-kafka"
version = "0.1.0"
edition = "2021"
publish = false

[features]
profile = []

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rdkafka = { version = "=0.39.0", default-features = false, features = ["dynamic-linking"] }
rusqlite = "=0.40.2"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
codegen-units = 1
